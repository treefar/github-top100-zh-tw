name: 每日更新 GitHub Top 100 並部署

on:
  schedule:
    # UTC 22:17 = 台灣時間次日 06:17；避開整點較可能發生的排程壅塞。
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/top100.json"
      - "data/history.json"
      - "data/summary-cache.json"
      - "assets/initial-data.js"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update ranking and Traditional Chinese summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          MAX_AI_SUMMARIES_PER_RUN: ${{ vars.MAX_AI_SUMMARIES_PER_RUN || '12' }}
        run: python scripts/update_rankings.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit daily data snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top100.json data/history.json data/summary-cache.json assets/initial-data.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update GitHub Top 100 $(date -u +%F)"
            git push
          fi

      - name: Build static site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
